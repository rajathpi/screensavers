<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekaboo</title>
<!--
  A small ink cat wanders in now and then and does something different each time:
  peeks from an edge, dashes across, tiptoes, hops, floats off on a balloon, walks under
  its own rain cloud, chases a butterfly, trips, skates, or curls up for a nap.
  URL options:  ?gap=3-10       seconds of empty paper between skits (min-max)
                ?only=nap,hop   restrict to these skits
                ?size=1         character size multiplier
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe8d8; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var gap = (q.get("gap") || "3-10").split("-").map(parseFloat);
  if (!(gap[0] >= 0)) gap = [3, 10]; if (!(gap[1] >= gap[0])) gap[1] = gap[0];
  var only = q.get("only") ? q.get("only").split(",") : null;
  var sizeMul = parseFloat(q.get("size")) || 1;

  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var dpr = Math.min(devicePixelRatio || 1, 2), W, H, S, G, paper;
  var TAU = Math.PI * 2, PI = Math.PI, rnd = Math.random;
  function range(a, b) { return a + rnd() * (b - a); }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeIn(p) { return p * p * p; }
  function easeInOut(p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function easeOutBack(p) { var c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }

  var VARIANTS = [
    { body: "#24201c", leg: "#24201c", line: "#f4efe6", eye: "#fbf8f0" },
    { body: "#24201c", leg: "#24201c", line: "#f4efe6", eye: "#fbf8f0", patches: ["#f4efe6"] },
    { body: "#e08a3c", leg: "#d07b30", line: "#3a2414", eye: "#fbf8f0", stripes: "#b8622a" },
    { body: "#8d929b", leg: "#7d828b", line: "#24201c", eye: "#fbf8f0", stripes: "#62676f" },
    { body: "#f6f1e7", leg: "#f6f1e7", line: "#2a2420", eye: "#ffffff", outline: "#2a2420", patches: ["#e08a3c", "#2a2420"] },
    { body: "#f6f1e7", leg: "#f6f1e7", line: "#2a2420", eye: "#ffffff", outline: "#2a2420" }
  ];

  function resize() {
    W = innerWidth; H = innerHeight;
    S = Math.min(W, H) * .062 * sizeMul; G = H * .9;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paper = document.createElement("canvas");
    paper.width = canvas.width; paper.height = canvas.height;
    var p = paper.getContext("2d");
    p.fillStyle = "#efe8d8"; p.fillRect(0, 0, paper.width, paper.height);
    var img = p.getImageData(0, 0, paper.width, paper.height), d = img.data;
    for (var i = 0; i < d.length; i += 4) { var n = (rnd() - .5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    p.putImageData(img, 0, 0);
    p.setTransform(dpr, 0, 0, dpr, 0, 0);
    var g = p.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) * .6);
    g.addColorStop(0, "rgba(90,60,30,0)"); g.addColorStop(1, "rgba(90,60,30,.2)");
    p.fillStyle = g; p.fillRect(0, 0, W, H);
  }

  function strokePath(c, col, outline, w, s) {
    if (outline) { c.strokeStyle = outline; c.lineWidth = w + s * .09; c.stroke(); }
    c.strokeStyle = col; c.lineWidth = w; c.stroke();
  }

  var clock = 0, blinkStart = -1, nextBlink = 2;
  function autoBlink() {
    if (clock > nextBlink) { blinkStart = clock; nextBlink = clock + range(2, 5.5); }
    var u = (clock - blinkStart) / .16;
    return u >= 0 && u < 1 ? Math.sin(u * PI) : 0;
  }

  function drawChar(c, o) {
    var v = o.v, s = o.s, legLen = .55 * s * o.legs;
    var ry = .9 * s * o.squash, rx = 1.05 * s / Math.sqrt(o.squash), by = -legLen - ry;
    var blink = o.blink == null ? autoBlink() : o.blink;
    c.save();
    c.translate(o.x, o.y);
    if (o.rot) c.rotate(o.rot);
    c.scale(o.face, 1);
    c.rotate(o.lean);
    c.lineCap = "round"; c.lineJoin = "round";
    if (o.prop === "skate") {
      c.fillStyle = "#a0522d";
      c.beginPath(); c.roundRect(-1.2 * s, 0, 2.4 * s, .14 * s, .07 * s); c.fill();
      c.fillStyle = "#2a2420";
      c.beginPath(); c.arc(-.75 * s, .24 * s, .1 * s, 0, TAU); c.arc(.75 * s, .24 * s, .1 * s, 0, TAU); c.fill();
    }
    if (o.spin) { c.translate(0, by); c.rotate(o.spin); c.translate(0, -by); }

    if (o.prop === "umbrella") {
      var ux = .45 * s, uy = by - 2.6 * s, r = 1.7 * s, seg = 2 * r / 5;
      c.beginPath(); c.moveTo(.55 * s, by + .1 * s); c.lineTo(.55 * s, uy);
      c.strokeStyle = "#3a2a20"; c.lineWidth = s * .07; c.stroke();
      c.beginPath(); c.moveTo(ux - r, uy); c.arc(ux, uy, r, PI, 0);
      for (var k = 0; k < 5; k++) { var xe = ux + r - (k + 1) * seg; c.quadraticCurveTo(xe + seg / 2, uy - seg * .35, xe, uy); }
      c.fillStyle = o.umbrellaColor; c.fill();
      c.strokeStyle = "rgba(0,0,0,.18)"; c.lineWidth = s * .04;
      for (k = 1; k < 5; k++) { c.beginPath(); c.moveTo(ux, uy - r); c.lineTo(ux - r + k * seg, uy - seg * .1); c.stroke(); }
      c.beginPath(); c.moveTo(ux, uy - r); c.lineTo(ux, uy - r - .25 * s); c.strokeStyle = "#3a2a20"; c.lineWidth = s * .06; c.stroke();
    }
    var wag = Math.sin(clock * 3.2) * .25 * s;
    c.beginPath(); c.moveTo(-rx * .85, by + ry * .35);
    c.quadraticCurveTo(-rx * 1.65, by + ry * .25 + wag, -rx * 1.35 + wag * .5, by - ry * .6);
    strokePath(c, v.leg, v.outline, s * .17, s);

    for (var i = 0; i < 2; i++) {
      var ph = o.leg + i * PI, hx = (i ? -.38 : .38) * s;
      var fx = hx + Math.sin(ph) * o.legAmp * s * .45, fy = -Math.max(0, Math.cos(ph)) * o.legAmp * s * .3;
      c.beginPath(); c.moveTo(hx, by + ry * .6); c.lineTo(fx, fy - s * .12);
      strokePath(c, v.leg, v.outline, s * .24, s);
    }

    function ear(cx) {
      c.beginPath();
      c.moveTo(cx - .32 * s, by - ry * .6);
      c.lineTo(cx - .04 * s, by - ry - .5 * s * o.ear);
      c.lineTo(cx + .3 * s, by - ry * .82);
      c.closePath(); c.fillStyle = v.body; c.fill();
      if (v.outline) { c.strokeStyle = v.outline; c.lineWidth = s * .07; c.stroke(); }
    }
    ear(-.38 * s); ear(.48 * s);

    c.beginPath(); c.ellipse(0, by, rx, ry, 0, 0, TAU);
    c.fillStyle = v.body; c.fill();
    if (v.stripes || v.patches) {
      c.save(); c.clip();
      if (v.stripes) {
        c.strokeStyle = v.stripes; c.lineWidth = s * .13;
        [-.45, -.08, .3].forEach(function (k) {
          c.beginPath(); c.moveTo(k * s, by - ry * 1.05); c.lineTo(k * s + .07 * s, by - ry * .55); c.stroke();
        });
        [-.25, .15].forEach(function (k) {
          c.beginPath(); c.moveTo(-rx * 1.05, by + k * s); c.lineTo(-rx * .5, by + k * s - .05 * s); c.stroke();
        });
      }
      if (v.patches) {
        c.fillStyle = v.patches[0]; c.beginPath(); c.arc(-.65 * s, by - .45 * s, .55 * s, 0, TAU); c.fill();
        if (v.patches[1]) { c.fillStyle = v.patches[1]; c.beginPath(); c.arc(.55 * s, by + .75 * s, .5 * s, 0, TAU); c.fill(); }
      }
      c.restore();
    }
    if (v.outline) { c.beginPath(); c.ellipse(0, by, rx, ry, 0, 0, TAU); c.strokeStyle = v.outline; c.lineWidth = s * .07; c.stroke(); }

    var eyes = [.02 * s, .52 * s], ey = by - ry * .08;
    c.fillStyle = "rgba(240,120,120," + (o.blush ? .55 : .3) + ")";
    eyes.forEach(function (e) { c.beginPath(); c.ellipse(e + .03 * s, ey + .3 * s, .13 * s, .07 * s, 0, 0, TAU); c.fill(); });
    eyes.forEach(function (e) {
      if (o.happy) {
        c.beginPath(); c.arc(e, ey + .08 * s, .13 * s, PI * 1.15, PI * 1.85);
        c.strokeStyle = v.line; c.lineWidth = s * .07; c.stroke(); return;
      }
      var h = .23 * s * (1 - blink);
      if (h < .03 * s) {
        c.beginPath(); c.moveTo(e - .15 * s, ey); c.quadraticCurveTo(e, ey + .07 * s, e + .15 * s, ey);
        c.strokeStyle = v.line; c.lineWidth = s * .06; c.stroke(); return;
      }
      c.save();
      c.beginPath(); c.ellipse(e, ey, .18 * s, h, 0, 0, TAU);
      c.fillStyle = v.eye; c.fill();
      if (v.outline) { c.strokeStyle = v.outline; c.lineWidth = s * .04; c.stroke(); }
      c.clip();
      var px = e + o.lookX * .07 * s + .02 * s, py = ey + o.lookY * .09 * s;
      c.fillStyle = "#1a1714"; c.beginPath(); c.arc(px, py, .11 * s, 0, TAU); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(px + .035 * s, py - .045 * s, .035 * s, 0, TAU); c.fill();
      c.restore();
    });
    var my = by + ry * .36;
    if (o.yawn > .05) {
      c.fillStyle = "#7a2a24"; c.beginPath(); c.ellipse(.28 * s, my + .04 * s, .09 * s, .14 * s * o.yawn, 0, 0, TAU); c.fill();
    } else {
      c.beginPath(); c.moveTo(.18 * s, my);
      c.quadraticCurveTo(.23 * s, my + .08 * s, .28 * s, my);
      c.quadraticCurveTo(.33 * s, my + .08 * s, .38 * s, my);
      c.strokeStyle = v.line; c.lineWidth = s * .05; c.stroke();
    }

    if (o.prop === "balloon") {
      var bx = .95 * s, byy = by - 4.1 * s, sw = Math.sin(clock * 1.7) * .3 * s;
      c.beginPath(); c.moveTo(.6 * s, by + .2 * s);
      c.bezierCurveTo(.4 * s + sw, by - 1.2 * s, 1.2 * s - sw, by - 2.2 * s, bx, byy + .85 * s);
      c.strokeStyle = "#3a2a20"; c.lineWidth = s * .03; c.stroke();
      c.fillStyle = o.balloonColor;
      c.beginPath(); c.ellipse(bx, byy, .7 * s, .85 * s, 0, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(bx, byy + .82 * s); c.lineTo(bx - .1 * s, byy + .98 * s); c.lineTo(bx + .1 * s, byy + .98 * s); c.fill();
      c.fillStyle = "rgba(255,255,255,.35)"; c.beginPath(); c.ellipse(bx - .25 * s, byy - .3 * s, .15 * s, .25 * s, -.4, 0, TAU); c.fill();
    }
    c.restore();
  }

  function shadow(c, o) {
    var lift = clamp((G - o.y) / (5 * o.s), 0, 1);
    c.fillStyle = "rgba(60,40,20," + (.13 * (1 - lift)) + ")";
    c.beginPath(); c.ellipse(o.x, G, o.s * 1.15 * (1 - lift * .5), o.s * .2 * (1 - lift * .5), 0, 0, TAU); c.fill();
  }

  // A skit is a list of [seconds, fn(p, st, t)] segments played back to back.
  function tl(segs) {
    var dur = 0; segs.forEach(function (s) { dur += s[0]; });
    return { dur: dur, run: function (t, st) {
      var acc = 0;
      for (var i = 0; i < segs.length; i++) {
        var d = segs[i][0];
        if (t < acc + d || i === segs.length - 1) { segs[i][1](clamp((t - acc) / d, 0, 1), st, t - acc); return; }
        acc += d;
      }
    } };
  }
  function walk(a, b, speed, o) {
    o = o || {};
    return [Math.abs(b - a) / speed, function (p, st, t) {
      st.x = lerp(a, b, p); st.face = b > a ? 1 : -1;
      st.leg = Math.abs(st.x - a) / (st.s * (o.stride || .42));
      st.legAmp = o.amp == null ? .7 : o.amp; st.lean = o.lean || 0;
      if (o.puffs) st.puffs = true;
      if (o.f) o.f(p, st, t);
    }];
  }
  function run(a, b, speed) { return walk(a, b, speed, { amp: 1, lean: .22, puffs: true }); }
  function hold(d, f) { return [d, f]; }

  var SKITS = {
    dash: function (c) {
      var v = W / range(1.6, 2.4), mid = W * range(.35, .65), pre = mid - c.d * c.s * 1.2;
      if (rnd() < .5) return tl([run(c.x0, c.x1, v)]);
      return tl([
        run(c.x0, pre, v),
        hold(.45, function (p, st) { st.x = pre + c.d * c.s * 1.2 * easeOut(p); st.lean = -.25 * (1 - p); st.legAmp = .3; st.leg = 1; st.puffs = p < .6; }),
        hold(1.8, function (p, st) { st.x = mid; st.lookX = -.3; st.blink = p > .45 && p < .52 ? 1 : 0; st.ear = 1.15; }),
        hold(.25, function (p, st) { st.x = mid; st.squash = 1 - .2 * Math.sin(p * PI); }),
        run(mid, c.x1, v * 1.1)
      ]);
    },
    tiptoe: function (c) {
      var v = W / range(12, 17), mid = W * range(.35, .65), stride = Math.abs(mid - c.x0) / (c.s * .3);
      return tl([
        walk(c.x0, mid, v, { stride: .3, amp: .45, lean: -.06, f: function (p, st) { st.squash = .84; st.lookX = .2 + .5 * Math.sin(p * 9); st.lookY = .2; } }),
        hold(1.7, function (p, st) { st.x = mid; st.squash = .84; st.leg = stride; st.legAmp = .45; st.lookX = -.3; st.ear = 1.2; st.blink = p > .5 && p < .56 ? 1 : 0; }),
        hold(.22, function (p, st) { st.x = mid; st.squash = .84 + .3 * p; }),
        run(mid, c.x1, W / 1.7)
      ]);
    },
    hop: function (c) {
      var L = c.s * range(2.6, 3.6), h = c.s * range(1.6, 2.6), air = .5, rest = .14, each = air + rest;
      var n = Math.ceil(Math.abs(c.x1 - c.x0) / L);
      return tl([[n * each, function (p, st) {
        var t = p * n * each, k = Math.min(n - 1, Math.floor(t / each)), u = t - k * each, start = c.x0 + c.d * k * L;
        if (u < air) {
          var r = u / air; st.x = start + c.d * L * r; st.y = G - 4 * h * r * (1 - r);
          st.squash = 1.12; st.leg = PI / 2; st.legAmp = .25; st.lean = .12 * (1 - 2 * r);
        } else { st.x = start + c.d * L; st.squash = 1 - .28 * Math.sin((u - air) / rest * PI); }
        st.happy = c.happy;
      }]]);
    },
    peekSide: function (c) {
      var hid = c.d > 0 ? -2.6 * c.s : W + 2.6 * c.s, pk = c.d > 0 ? .5 * c.s : W - .5 * c.s, segs = [
        hold(1.1, function (p, st) { st.x = lerp(hid, pk, easeOut(p)); st.lean = .18 * p; }),
        hold(2.8, function (p, st) { st.x = pk; st.lean = .18 + .06 * Math.sin(p * 7); st.lookX = Math.cos(p * PI * 3); st.lookY = -.4 * Math.sin(p * TAU); }),
        hold(1.4, function (p, st) { st.x = pk; st.lean = .12; st.lookX = -.3; st.blink = p > .45 && p < .52 ? 1 : 0; st.happy = c.happy && p > .6; })
      ];
      if (rnd() < .55) segs.push(hold(.35, function (p, st) { st.x = lerp(pk, hid, easeIn(p)); st.lean = .12 - .3 * p; }));
      else {
        segs.push(hold(.3, function (p, st) { st.x = pk; st.squash = 1 - .22 * Math.sin(p * PI); }));
        segs.push(run(pk, c.x1, W / 2));
      }
      return tl(segs);
    },
    peekBottom: function (c) {
      var x = W * range(.15, .85), hid = H + 3.6 * c.s, pk = H + 1.05 * c.s;
      function at(st, y) { st.x = x; st.y = y; st.shadow = false; }
      return tl([
        hold(1.2, function (p, st) { at(st, lerp(hid, pk, easeOutBack(p))); }),
        hold(1.1, function (p, st) { at(st, pk); st.lookX = -1; st.lookY = -.3; }),
        hold(1.1, function (p, st) { at(st, pk); st.lookX = 1; st.lookY = -.3; }),
        hold(1.6, function (p, st) { at(st, pk); st.lookX = -.3; st.blink = p > .3 && p < .37 ? 1 : 0; st.happy = c.happy && p > .55; st.ear = 1.1; }),
        hold(.5, function (p, st) { at(st, lerp(pk, hid, easeIn(p))); })
      ]);
    },
    peekTop: function (c) {
      var x = W * range(.15, .85), hid = -3.8 * c.s, pk = -.75 * c.s;
      function at(st, y) { st.x = x; st.y = y; st.rot = PI; st.shadow = false; }
      return tl([
        hold(1.3, function (p, st) { at(st, lerp(hid, pk, easeOutBack(p))); }),
        hold(3.8, function (p, st) { at(st, pk); st.rot = PI + .14 * Math.sin(p * PI * 4) * (1 - p * .6); st.lookX = Math.cos(p * PI * 2.5); st.lookY = .3; st.happy = c.happy && p > .7; }),
        hold(.5, function (p, st) { at(st, lerp(pk, hid, easeIn(p))); })
      ]);
    },
    balloon: function (c) {
      var xs = W * range(.2, .8), dur = range(14, 18), col = pick(["#d8483a", "#e3a72f", "#4f8fc0", "#e07fa6"]);
      return tl([[dur, function (p, st) {
        var t = p * dur;
        st.x = xs + Math.sin(t * .55) * 1.6 * c.s + c.d * t * W * .012; st.y = lerp(H + 1.5 * c.s, -7 * c.s, p);
        st.shadow = false; st.prop = "balloon"; st.balloonColor = col;
        st.leg = Math.sin(t * 2.2) * 1.2; st.legAmp = .35; st.lean = Math.sin(t * .9) * .08;
        st.happy = c.happy; st.lookY = -.5;
      }]]);
    },
    umbrella: function (c) {
      var v = W / range(14, 19), col = pick(["#c8402e", "#2f6f9f", "#e3a72f", "#6a9a4a"]), drops = [];
      var sk = tl([walk(c.x0, c.x1, v, { stride: .4, f: function (p, st) { st.prop = "umbrella"; st.umbrellaColor = col; st.lookY = -.2; } })]);
      sk.extra = function (g, st, dt) {
        var s = c.s, cx = st.x - c.d * .3 * s, cy = G - 7.4 * s;
        for (var n = 0; n < 40 * dt; n++) if (drops.length < 120) drops.push({ x: cx + range(-1.7, 1.7) * s, y: cy + .3 * s });
        var ux = st.x + st.face * .45 * s, uy = G - 4.05 * s, r = 1.7 * s;
        g.strokeStyle = "rgba(80,110,140,.55)"; g.lineWidth = Math.max(1, s * .035);
        g.beginPath();
        for (var i = drops.length - 1; i >= 0; i--) {
          var d = drops[i]; d.y += 11 * s * dt;
          var dx = d.x - ux;
          if (d.y > G - .05 * s || (Math.abs(dx) < r && d.y > uy - Math.sqrt(r * r - dx * dx))) { drops.splice(i, 1); continue; }
          g.moveTo(d.x, d.y); g.lineTo(d.x, d.y + .25 * s);
        }
        g.stroke();
        g.fillStyle = "#a3abb4";
        [[-1, .1, .7], [-.3, -.25, .9], [.5, -.1, .8], [1.1, .15, .6], [.1, .2, .75]].forEach(function (b) {
          g.beginPath(); g.arc(cx + b[0] * s, cy + b[1] * s, b[2] * s, 0, TAU); g.fill();
        });
      };
      return sk;
    },
    butterfly: function (c) {
      var v = W / range(7, 10), dur = Math.abs(c.x1 - c.x0) / v + 1, col = pick(["#f2b134", "#7fb2e0", "#e88aa8", "#b6d36b"]);
      var sk = tl([[dur, function (p, st) {
        var t = p * dur;
        st.x = c.x0 + c.d * v * t; st.face = c.d;
        var ph = (t % 1.5) / 1.5;
        if (ph < .38) { st.y = G - Math.sin(ph / .38 * PI) * 1.3 * c.s; st.squash = 1.1; st.legAmp = .3; st.leg = PI / 2; }
        else { st.leg = t * v / (c.s * .42); st.legAmp = .9; }
        st.lean = .1; st.lookX = .8; st.lookY = -.8; st.happy = c.happy;
        st.bx = st.x + c.d * 3 * c.s; st.by = G - 3.2 * c.s + Math.sin(t * 2.1) * 1.1 * c.s + Math.sin(t * 5.3) * .35 * c.s;
      }]]);
      sk.extra = function (g, st) {
        var s = c.s, f = .25 + .75 * Math.abs(Math.sin(clock * 15));
        g.save(); g.translate(st.bx, st.by);
        g.fillStyle = col;
        [-1, 1].forEach(function (side) {
          g.save(); g.scale(side * f, 1);
          g.beginPath(); g.ellipse(.3 * s, -.12 * s, .3 * s, .22 * s, -.3, 0, TAU); g.fill();
          g.beginPath(); g.ellipse(.2 * s, .14 * s, .19 * s, .14 * s, .3, 0, TAU); g.fill();
          g.restore();
        });
        g.fillStyle = "#2a2420"; g.beginPath(); g.ellipse(0, 0, .05 * s, .2 * s, 0, 0, TAU); g.fill();
        g.restore();
      };
      return sk;
    },
    trip: function (c) {
      var v = W / range(2.8, 3.6), mid = W * range(.35, .6), roll = 2.2 * c.s, end = mid + c.d * roll;
      var sk = tl([
        run(c.x0, mid, v),
        hold(.75, function (p, st) { st.x = mid + c.d * roll * easeOut(p); st.spin = TAU * easeOut(p); st.y = G - Math.sin(p * PI) * .4 * c.s; st.squash = .85; }),
        hold(1.9, function (p, st, t) { st.x = end; st.squash = .8; st.legs = .4; st.dizzy = true; st.lookX = Math.sin(t * 9) * .8; st.lookY = Math.cos(t * 9) * .6; st.ear = .7; }),
        hold(.55, function (p, st) { st.x = end; st.lean = Math.sin(p * PI * 6) * .12; st.squash = lerp(.8, 1, p); }),
        hold(1.2, function (p, st) { st.x = end; st.lookX = -.3; st.happy = true; st.blush = true; }),
        walk(end, c.x1, W / 11)
      ]);
      sk.extra = function (g, st) {
        if (!st.dizzy) return;
        var s = c.s;
        g.fillStyle = "#e3a72f";
        for (var i = 0; i < 3; i++) {
          var a = clock * 3 + i * TAU / 3, x = st.x + Math.cos(a) * .9 * s, y = G - 2.4 * s + Math.sin(a) * .25 * s;
          g.beginPath();
          for (var k = 0; k < 10; k++) {
            var r = k % 2 ? .07 * s : .17 * s, b = k * PI / 5 - PI / 2;
            g.lineTo(x + Math.cos(b) * r, y + Math.sin(b) * r);
          }
          g.fill();
        }
      };
      return sk;
    },
    skate: function (c) {
      var v = W / range(5.5, 8), mid = W * range(.35, .65);
      return tl([[Math.abs(c.x1 - c.x0) / v, function (p, st, t) {
        st.x = lerp(c.x0, c.x1, p); st.prop = "skate"; st.y = G - .34 * c.s;
        st.leg = PI / 2; st.legAmp = .9; st.lean = .04 + .03 * Math.sin(t * 2); st.squash = .95;
        var j = (st.x - (mid - c.d * 1.6 * c.s)) * c.d / (3.2 * c.s);
        if (j > 0 && j < 1) { st.y -= Math.sin(j * PI) * 1.7 * c.s; st.lean += Math.sin(j * TAU) * .2; st.happy = true; }
        else st.happy = c.happy;
      }]]);
    },
    nap: function (c) {
      var xt = W * range(.3, .7), v = W / range(11, 14), sleep = range(10, 16), zs = [], lastZ = 0;
      var sk = tl([
        walk(c.x0, xt, v),
        hold(1.4, function (p, st) { st.x = xt; st.squash = 1 + .15 * Math.sin(p * PI); st.yawn = Math.sin(p * PI); st.blink = .6 * Math.sin(p * PI); }),
        hold(.9, function (p, st) { var e = easeInOut(p); st.x = xt; st.squash = lerp(1, .62, e); st.legs = lerp(1, .05, e); st.blink = p; st.ear = 1 - .3 * p; }),
        hold(sleep, function (p, st, t) { st.x = xt; st.squash = .62 + .025 * Math.sin(t * 1.8); st.legs = .05; st.blink = 1; st.ear = .7; st.sleep = true; }),
        hold(1, function (p, st) { var e = easeOut(p); st.x = xt; st.squash = lerp(.62, 1.18, e); st.legs = lerp(.05, 1, e); st.blink = 1 - p; }),
        hold(.5, function (p, st) { st.x = xt; st.squash = lerp(1.18, 1, p); }),
        hold(1.2, function (p, st) { st.x = xt; st.lookX = -.3; st.happy = c.happy; }),
        walk(xt, c.x1, v)
      ]);
      sk.extra = function (g, st, dt) {
        if (st.sleep && clock - lastZ > 1.5) { lastZ = clock; zs.push({ x: st.x + st.face * .6 * c.s, y: G - 1.6 * c.s, a: 0 }); }
        g.fillStyle = "#3a3430";
        for (var i = zs.length - 1; i >= 0; i--) {
          var z = zs[i]; z.a += dt / 3.5;
          if (z.a >= 1) { zs.splice(i, 1); continue; }
          g.globalAlpha = Math.sin(z.a * PI) * .8;
          g.font = "600 " + Math.round(c.s * (.4 + z.a * .5)) + "px Georgia, serif";
          g.fillText("z", z.x + st.face * z.a * 1.2 * c.s + Math.sin(z.a * 8) * .15 * c.s, z.y - z.a * 2.2 * c.s);
        }
        g.globalAlpha = 1;
      };
      return sk;
    }
  };

  var names = Object.keys(SKITS).filter(function (n) { return !only || only.indexOf(n) >= 0; });
  if (!names.length) names = Object.keys(SKITS);
  var recent = [], skit = null, skitT = 0, wait = 1.2, puffs = [];

  function start() {
    var pool = names.filter(function (n) { return recent.indexOf(n) < 0; });
    var name = pick(pool.length ? pool : names);
    recent.push(name); if (recent.length > Math.min(3, names.length - 1)) recent.shift();
    var s = S * range(.8, 1.2), d = rnd() < .5 ? 1 : -1;
    var c = { s: s, d: d, v: pick(VARIANTS), happy: rnd() < .5, x0: d > 0 ? -3 * s : W + 3 * s, x1: d > 0 ? W + 3 * s : -3 * s };
    skit = SKITS[name](c); skit.c = c; skitT = 0;
  }
  function state(c) {
    return { x: c.x0, y: G, s: c.s, v: c.v, face: c.d, squash: 1, legs: 1, lean: 0, leg: 0, legAmp: 0, lookX: 1, lookY: 0,
             blink: null, happy: false, blush: false, rot: 0, spin: 0, ear: 1, yawn: 0, prop: null, shadow: true };
  }

  resize();
  addEventListener("resize", function () { resize(); skit = null; wait = 1; });

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
    ctx.drawImage(paper, 0, 0, W, H);
    for (var i = puffs.length - 1; i >= 0; i--) {
      var f = puffs[i]; f.life -= dt * 1.6;
      if (f.life <= 0) { puffs.splice(i, 1); continue; }
      f.x += f.vx * dt; f.y -= f.s * .4 * dt; f.r += f.s * .5 * dt;
      ctx.fillStyle = "rgba(120,100,80," + (.18 * f.life) + ")";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    }
    if (!skit) { wait -= dt; if (wait <= 0) start(); return; }
    skitT += dt;
    if (skitT > skit.dur) { skit = null; wait = range(gap[0], gap[1]); return; }
    var st = state(skit.c);
    skit.run(skitT, st);
    if (st.puffs && puffs.length < 40 && rnd() < dt * 14)
      puffs.push({ x: st.x - st.face * .6 * st.s, y: G - .12 * st.s, r: .12 * st.s, vx: -st.face * st.s * .8, s: st.s, life: 1 });
    if (st.shadow) shadow(ctx, st);
    drawChar(ctx, st);
    if (skit.extra) skit.extra(ctx, st, dt);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
